[project]
name = "job-search"
version = "0.1.0"
description = "Job-search MCP server and drafting crew for Hermes"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai==1.15.39",
    "litellm>=1.109.1",
    "mcp==1.30.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.9.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_search"]
