[project]
name = "sre-crews"
version = "0.1.0"
description = "SRE crews (investigate_alert, weekly_capacity_report) exposed as MCP tools for Hermes"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai==1.15.39",
    "mcp==1.30.0",
    "kubernetes==36.0.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.9.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sre_crews"]
