name: image

on:
  push:
    branches: [main]
    paths:
      - 'crews/**'

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: login to ghcr
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6.13.0
        with:
          context: crews
          push: true
          tags: ghcr.io/ssaav5-ai-labs/sre-crews:${{ steps.tag.outputs.tag }}
          provenance: false

      - name: summary
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/ssaav5-ai-labs/sre-crews:${{ steps.tag.outputs.tag }} --format '{{json .Manifest.Digest}}' 2>/dev/null || echo unknown)
          echo "image: ghcr.io/ssaav5-ai-labs/sre-crews:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"