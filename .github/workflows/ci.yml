name: ci
on: [push, pull_request]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz
          ./gitleaks detect -v

      - name: shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz" | tar xJ
          ./shellcheck-v0.11.0/shellcheck -x scripts/check-skills.sh

      - name: install pyyaml
        run: python3 -m pip install --quiet pyyaml==6.0.2

      - name: check-skills
        run: scripts/check-skills.sh

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.13.7/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: crews sync
        run: uv sync --all-groups
        working-directory: crews

      - name: crews ruff
        run: uv run ruff check
        working-directory: crews

      - name: crews pytest
        run: uv run pytest
        working-directory: crews

      - name: crews docker build
        run: docker build -t sre-crews:ci .
        working-directory: crews
